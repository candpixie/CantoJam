<text x="39" y="389.5" font-size="9.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="54" y="390.0" font-size="11" fill="#1a1a1a">Tone 5 sits with tone 3, not tone 6. The ladder buckets 5 and 6 onto one rung,</text>
<text x="54" y="406.0" font-size="11" fill="#1a1a1a">but 6→5 rises 96.7% of the time (n=1,559) and 5→6 falls 92.8% (n=1,216).</text>
<circle cx="39" cy="426.0" r="7" fill="#c0567e"/>
<text x="39" y="429.5" font-size="9.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="54" y="430.0" font-size="11" fill="#1a1a1a">Tone 4 is a cliff, not a rung. The ladder puts it one step below tone 6; measured, it is 2.97 semitones below,</text>
<text x="54" y="446.0" font-size="11" fill="#1a1a1a">the largest gap between any two adjacent tones.</text>
<text x="32" y="474" font-size="10" fill="#6b6b6b">Ladder rungs are evenly spaced by construction: 0243 encodes order and grouping, not distance.</text>
